<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MekkTimm Charity</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            max-width: 550px;
            width: 100%;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .badge {
            display: inline-block;
            padding: 6px 12px;
            background-color: #e0f2fe;
            color: #0284c7;
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 12px;
            color: #0f172a;
        }
        p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #64748b;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Willkommen</span>
        <h1>MekkTimm Charity</h1>
        <p>Gemeinsam Gutes tun. Unsere Landingpage entsteht gerade – schau bald wieder vorbei!</p>
        <a href="#" class="btn">Mehr erfahren</a>
    </div>
</body>
</html>
